# production 專用設定，只使用雲端連線、雲端密碼與 CA。
# 在 collector 目錄執行 docker compose -f docker-compose.yml up -d --build。
services:
  collector:
    build:
      context: .
      target: runtime
    image: wjcch-collector:hr-modes
    container_name: wjcch-collector
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Taipei
      DATA_DIR: /data
      COLLECTOR_PROFILE: production
      CLOUD_DB_PASSWORD_FILE: /run/secrets/collector_database_password
    volumes:
      - ./data:/data
      - type: bind
        # 來源必須是密碼檔案，不是同名資料夾；相對於 collector 目錄。
        source: ./.local/database/secrets/hr_collector_supabase_password
        target: /run/secrets/collector_database_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/database/certs
        target: /run/certs
        read_only: true
        bind:
          create_host_path: false
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-m", "collector", "health"]
      interval: 1m
      timeout: 10s
      start_period: 2m
